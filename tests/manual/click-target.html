<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Click Target</title>
<link rel="stylesheet" href="click-target.css">
</head>
<body>
  <main>
    <button id="target" type="button">CLICK TARGET</button>
    <p class="count">Count: <output id="count">0</output></p>
    <p class="hint">Each real click increments once. No network calls.</p>
    <button id="reset" type="button" class="reset">Reset</button>
  </main>
  <script src="click-target.js"></script>
</body>
</html>
