# XcodeGen spec. Generates ClickBridgeMac.xcodeproj deterministically.
#
#   brew install xcodegen
#   cd mac && xcodegen generate
#
# A hand-written .pbxproj cannot be verified without macOS, so the project is
# generated from this file instead of committed as opaque XML.

name: ClickBridgeMac

options:
  bundleIdPrefix: com.clickbridge
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Deterministic ad-hoc signing so a personal build works with no account.
    # Local.xcconfig may override with an Apple Development identity, which
    # avoids re-granting input permission after every rebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # App Sandbox is deliberately absent. CGEvent.post IS sandbox-compatible;
    # staying unsandboxed is a simplicity choice for a personal build, not a
    # technical requirement.
    ENABLE_HARDENED_RUNTIME: NO

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

targets:
  ClickBridgeMac:
    type: application
    platform: macOS
    sources:
      - path: ClickBridgeMac
    info:
      path: ClickBridgeMac/Info.plist
      properties:
        CFBundleName: Click Bridge
        CFBundleDisplayName: Click Bridge
        # Menu-bar only: no Dock icon, no main window.
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.mac
        INFOPLIST_KEY_LSUIElement: YES

  ClickBridgeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClickBridgeMacTests
    dependencies:
      - target: ClickBridgeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.mac.tests
    # Canonical fixtures are shared with the Node suite — one contract, two
    # implementations reading the same bytes.
    resources:
      - ../contracts/fixtures

schemes:
  ClickBridgeMac:
    build:
      targets:
        ClickBridgeMac: all
        ClickBridgeMacTests: [test]
    test:
      targets:
        - ClickBridgeMacTests
      gatherCoverageData: false
