# XcodeGen spec. Generates ClickBridgeMac.xcodeproj deterministically.
#
#   brew install xcodegen
#   cd mac && xcodegen generate
#
# A hand-written .pbxproj cannot be verified without macOS, so the project is
# generated from this file instead of committed as opaque XML.

name: ClickBridgeMac

options:
  bundleIdPrefix: com.clickbridge
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "5.9"
    # Signing defaults live in Config/Base.xcconfig so its optional
    # Local.xcconfig include can override them for a stable local identity.
    CODE_SIGN_STYLE: Manual
    # Direct Developer ID archives override these target settings below. The
    # App Store / TestFlight target must be sandboxed.
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  ClickBridgeMac:
    type: application
    platform: macOS
    sources:
      # Enrollment storage is source-discovered with the rest of the app so
      # regenerated projects cannot omit the atomic Keychain record type.
      - path: ClickBridgeMac
    info:
      path: ClickBridgeMac/Info.plist
      properties:
        CFBundleName: Click Bridge
        CFBundleDisplayName: Click Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        # Menu-bar only: no Dock icon, no main window.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.mac
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: ClickBridgeMac/ClickBridgeMac-AppStore.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES

  ClickBridgeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClickBridgeMacTests
      - path: ../contracts/fixtures
        name: fixtures
        group: contracts
        createIntermediateGroups: false
        buildPhase: resources
    dependencies:
      - target: ClickBridgeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClickBridgeMac:
    build:
      targets:
        ClickBridgeMac: all
        ClickBridgeMacTests: [test]
    test:
      targets:
        - ClickBridgeMacTests
      gatherCoverageData: false
