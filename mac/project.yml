# XcodeGen spec. Generates ClickBridgeMac.xcodeproj deterministically.
#
#   brew install xcodegen
#   cd mac && xcodegen generate
#
# A hand-written .pbxproj cannot be verified without macOS, so the project is
# generated from this file instead of committed as opaque XML.

name: ClickBridgeMac

options:
  bundleIdPrefix: com.clickbridge
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Deterministic ad-hoc signing so a personal build works with no account.
    # Local.xcconfig may override with an Apple Development identity, which
    # avoids re-granting input permission after every rebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # App Sandbox is deliberately absent. CGEvent.post IS sandbox-compatible;
    # staying unsandboxed is a simplicity choice for a personal build, not a
    # technical requirement.
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  ClickBridgeMac:
    type: application
    platform: macOS
    sources:
      - path: ClickBridgeMac
    info:
      path: ClickBridgeMac/Info.plist
      properties:
        CFBundleName: Click Bridge
        CFBundleDisplayName: Click Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        # Menu-bar only: no Dock icon, no main window.
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.mac
        INFOPLIST_KEY_LSUIElement: YES

  ClickBridgeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClickBridgeMacTests
      - path: ../contracts/fixtures
        name: fixtures
        group: contracts
        createIntermediateGroups: false
        buildPhase: resources
    dependencies:
      - target: ClickBridgeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClickBridgeMac:
    build:
      targets:
        ClickBridgeMac: all
        ClickBridgeMacTests: [test]
    test:
      targets:
        - ClickBridgeMacTests
      gatherCoverageData: false
