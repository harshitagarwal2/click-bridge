name: ClickBridgePhone
options:
  bundleIdPrefix: com.clickbridge
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "5.9"
fileGroups:
  - TestFlight
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  ClickBridgePhone:
    type: application
    platform: iOS
    sources:
      - path: ClickBridgePhone
    info:
      path: ClickBridgePhone/Info.plist
      properties:
        CFBundleDisplayName: Click Bridge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan a Click Bridge pairing code shown on your Mac.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.phone
        # Deployment-specific: update the entitlement, PhoneDeployment.pairingHost,
        # and the relay's apple-app-site-association file together for another host.
        CODE_SIGN_ENTITLEMENTS: ClickBridgePhone/ClickBridgePhone.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  ClickBridgePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClickBridgePhoneTests
      - path: ../contracts/fixtures
        name: fixtures
        group: contracts
        createIntermediateGroups: false
        buildPhase: resources
      - path: ../contracts/config
        name: config
        group: contracts
        createIntermediateGroups: false
        buildPhase: resources
    dependencies:
      - target: ClickBridgePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clickbridge.phone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClickBridgePhone:
    build:
      targets:
        ClickBridgePhone: all
        ClickBridgePhoneTests: [test]
    test:
      targets:
        - ClickBridgePhoneTests
      gatherCoverageData: false
