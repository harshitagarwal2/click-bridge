# Rename "app", pick the region CLOSEST to where phone + laptop both are.
# Region list: fly platform regions
# sjc = San Jose  |  iad = Ashburn VA  |  lhr = London  |  sin = Singapore
# Placing the relay geographically between phone and laptop is the single
# biggest latency lever on the internet path.

app            = "click-bridge"
primary_region = "sjc"

[build]

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # MUST be false — receiver must stay connected
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
