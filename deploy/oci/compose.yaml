services:
  relay:
    x-click-bridge-pairing-auth-contract: 1
    build:
      context: ../..
      dockerfile: deploy/oci/Dockerfile
    image: click-bridge-relay:${CLICK_BRIDGE_RELEASE}
    restart: unless-stopped
    env_file:
      - ${CLICK_BRIDGE_SECRETS_FILE:-/opt/click-bridge/shared/secrets.env}
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    volumes:
      - /opt/click-bridge/shared/auth:/var/lib/click-bridge/auth
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/healthz').then(async response=>{if(!response.ok||(await response.text())!=='ok')process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      CLICK_BRIDGE_DOMAIN: ${CLICK_BRIDGE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
