name: Private GHCR relay image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag that must point at the dispatched commit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ghcr-relay-release
  cancel-in-progress: false

jobs:
  verify-environment:
    name: Verify protected release environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require independent release approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: ghcr-private
        run: |
          set -Eeuo pipefail
          encoded_environment="$(jq -rn --arg name "$RELEASE_ENVIRONMENT" '$name | @uri')"
          environment_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/${encoded_environment}"
          )"
          jq -e --arg expected "$RELEASE_ENVIRONMENT" '
            .name == $expected and
            .can_admins_bypass == false and
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | type == "array" and length >= 1)
            )
          ' <<< "$environment_json" >/dev/null

  publish:
    name: Publish versioned private relay image
    needs: verify-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ghcr-private
    steps:
      - name: Revalidate protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: ghcr-private
        run: |
          set -Eeuo pipefail
          encoded_environment="$(jq -rn --arg name "$RELEASE_ENVIRONMENT" '$name | @uri')"
          environment_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/${encoded_environment}"
          )"
          jq -e --arg expected "$RELEASE_ENVIRONMENT" '
            .name == $expected and
            .can_admins_bypass == false and
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | type == "array" and length >= 1)
            )
          ' <<< "$environment_json" >/dev/null

      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$EVENT_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$EVENT_SHA"
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "RELAY_IMAGE=ghcr.io/${owner}/click-bridge-relay"
          } >> "$GITHUB_ENV"

      - name: Warn about package visibility gate
        run: |
          echo '::warning::Before approving this protected environment, verify the GHCR click-bridge-relay package visibility is Private. This workflow never changes package visibility.'
          {
            echo '### GHCR release safety'
            echo '- The protected environment reviewer must verify the package remains **Private**.'
            echo '- Tags are immutable release version and commit SHA only; no latest tag is emitted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR with the job token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite immutable image tags
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          image_path="${RELAY_IMAGE#ghcr.io/}"
          registry_token="$(
            curl --fail --silent --show-error --get \
              --user "${GH_ACTOR}:${GH_TOKEN}" \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${image_path}:pull" \
              https://ghcr.io/token |
              jq -er '.token // .access_token'
          )"

          assert_tag_absent() {
            local tag="$1"
            local response="$RUNNER_TEMP/ghcr-manifest-response.json"
            local status
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${registry_token}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${image_path}/manifests/${tag}"
            )"
            case "$status" in
              404)
                rm -f "$response"
                ;;
              200)
                echo "::error::${RELAY_IMAGE}:${tag} already exists; refusing to overwrite an immutable release tag."
                exit 1
                ;;
              *)
                echo "::error::GHCR registry returned HTTP ${status} while checking ${RELAY_IMAGE}:${tag}; refusing to push without proving the tag is absent."
                exit 1
                ;;
            esac
          }

          assert_tag_absent "$RELEASE_VERSION"
          assert_tag_absent "sha-$EVENT_SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define version and SHA tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.RELAY_IMAGE }}
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=sha-${{ github.sha }}
          flavor: |
            latest=false

      - name: Build and push the relay image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/oci/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true

      - name: Verify published tags resolve to the pushed digest
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          image_path="${RELAY_IMAGE#ghcr.io/}"
          registry_token="$(
            curl --fail --silent --show-error --get \
              --user "${GH_ACTOR}:${GH_TOKEN}" \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${image_path}:pull" \
              https://ghcr.io/token |
              jq -er '.token // .access_token'
          )"

          assert_tag_digest() {
            local tag="$1"
            local headers="$RUNNER_TEMP/ghcr-manifest-headers.txt"
            local response="$RUNNER_TEMP/ghcr-manifest-response.json"
            local actual_digest
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header "$headers" \
              --output "$response" \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${image_path}/manifests/${tag}"
            actual_digest="$(
              awk 'tolower($1) == "docker-content-digest:" { gsub(/\r/, "", $2); digest = $2 } END { print digest }' "$headers"
            )"
            if [[ -z "$actual_digest" || "$actual_digest" != "$IMAGE_DIGEST" ]]; then
              echo "::error::${RELAY_IMAGE}:${tag} resolved to ${actual_digest:-no digest}, expected ${IMAGE_DIGEST}."
              exit 1
            fi
          }

          assert_tag_digest "$RELEASE_VERSION"
          assert_tag_digest "sha-$EVENT_SHA"

      - name: Record immutable digest
        env:
          EVENT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published private relay image'
            echo "- Image: \`$RELAY_IMAGE\`"
            echo "- Version tag: \`$RELEASE_VERSION\`"
            echo "- Commit tag: \`sha-${EVENT_SHA}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
