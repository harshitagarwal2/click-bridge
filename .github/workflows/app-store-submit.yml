name: App Store review submission

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y or vX.Y.Z tag matching Config/Version.xcconfig
        required: true
        type: string
      build_number:
        description: Exact processed iOS and macOS TestFlight build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-store-release
  cancel-in-progress: false

jobs:
  submit:
    name: Select processed iOS and macOS builds and submit for review
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: app-store
    steps:

      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag and build number
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]
          test "$EVENT_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$EVENT_SHA"
          if ! git merge-base --is-ancestor "$EVENT_SHA" refs/remotes/origin/main; then
            echo "::error::Release commit ${EVENT_SHA} is not reachable from origin/main."
            exit 1
          fi
          ci_runs="$(
            curl --fail-with-body --silent --show-error --get \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --data-urlencode 'branch=main' \
              --data-urlencode 'event=push' \
              --data-urlencode 'status=success' \
              --data-urlencode "head_sha=${EVENT_SHA}" \
              --data-urlencode 'per_page=1' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          )"
          if ! jq -e --arg sha "$EVENT_SHA" '
            any(.workflow_runs[]?;
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )
          ' <<< "$ci_runs" >/dev/null; then
            echo "::error::No completed successful CI push run exists on main for ${EVENT_SHA}."
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          repository_version="$(./.github/scripts/read-apple-version.sh marketing)"
          test "$release_version" = "$repository_version"
          {
            echo "RELEASE_VERSION=$release_version"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Reject placeholder store metadata
        run: |
          set -Eeuo pipefail
          if grep -R -q 'REPLACE BEFORE RELEASE\|REPLACE-BEFORE-RELEASE' fastlane/metadata; then
            echo 'Replace all Fastlane metadata placeholders before submission.' >&2
            exit 1
          fi

      - name: Select Ruby and install locked Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure ephemeral App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          api_key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | openssl base64 -d -A -out "$api_key"
          chmod 0600 "$api_key"
          echo "APP_STORE_CONNECT_KEY_PATH=$api_key" >> "$GITHUB_ENV"

      - name: Submit the existing processed iOS build for review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane ios submit_app_store release_version:"$RELEASE_VERSION" build_number:"$BUILD_NUMBER"

      - name: Submit the existing processed macOS build for review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bundle exec fastlane mac submit_app_store release_version:"$RELEASE_VERSION" build_number:"$BUILD_NUMBER"

      - name: Remove ephemeral API key
        if: ${{ always() }}
        run: test -z "${APP_STORE_CONNECT_KEY_PATH:-}" || rm -f "$APP_STORE_CONNECT_KEY_PATH"
