name: Notarized macOS draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag that must point at the dispatched commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-notarized-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, verify, and create a draft release
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: macos-release
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$EVENT_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$EVENT_SHA"
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          set -Eeuo pipefail
          version='2.46.0'
          expected_sha256='4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
          archive="$RUNNER_TEMP/xcodegen-${version}.zip"
          extracted="$RUNNER_TEMP/xcodegen-${version}-source"
          install_root="$RUNNER_TEMP/xcodegen-${version}"
          curl --fail --location --retry 3 \
            --output "$archive" \
            'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip'
          printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$extracted"
          PREFIX="$install_root" "$extracted/xcodegen/install.sh"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/xcodegen" --version | grep -Fx 'Version: 2.46.0'

      - name: Configure ephemeral Developer ID signing and notary API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for required in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64 MAC_CERTIFICATE_BASE64 MAC_CERTIFICATE_PASSWORD; do
            test -n "${!required}"
          done

          keychain="$RUNNER_TEMP/click-bridge-macos-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$MAC_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$certificate"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | openssl base64 -d -A -out "$api_key"
          chmod 0600 "$certificate" "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          echo "APP_STORE_CONNECT_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_KEY_PATH=$api_key" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_CERTIFICATE_PATH=$certificate" >> "$GITHUB_ENV"

      - name: Generate the macOS project
        working-directory: mac
        run: xcodegen generate

      - name: Archive with hardened runtime and timestamp
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -Eeuo pipefail
          test -n "$APPLE_TEAM_ID"
          xcodebuild archive \
            -project mac/ClickBridgeMac.xcodeproj \
            -scheme ClickBridgeMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ClickBridgeMac.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS='--timestamp'

      - name: Notarize, staple, verify, and checksum
        run: |
          set -Eeuo pipefail
          app="$RUNNER_TEMP/ClickBridgeMac.xcarchive/Products/Applications/ClickBridgeMac.app"
          output="$RUNNER_TEMP/release-output"
          pre_notary="$RUNNER_TEMP/ClickBridgeMac-notarization.zip"
          notary_result="$RUNNER_TEMP/ClickBridgeMac-notary-result.json"
          notary_log="$RUNNER_TEMP/ClickBridgeMac-notary-log.json"
          archive="$output/ClickBridgeMac-${RELEASE_VERSION}.zip"
          install -d "$output"

          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$pre_notary"
          if ! xcrun notarytool submit "$pre_notary" \
              --key "$APP_STORE_CONNECT_KEY_PATH" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --wait \
              --output-format json > "$notary_result"; then
            cat "$notary_result" >&2
            request_id="$(plutil -extract id raw -o - "$notary_result" 2>/dev/null || true)"
            if [[ -n "$request_id" ]]; then
              xcrun notarytool log "$request_id" "$notary_log" \
                --key "$APP_STORE_CONNECT_KEY_PATH" \
                --key-id "$APP_STORE_CONNECT_KEY_ID" \
                --issuer "$APP_STORE_CONNECT_ISSUER_ID" || true
              cat "$notary_log" >&2 || true
            fi
            exit 1
          fi
          request_id="$(plutil -extract id raw -o - "$notary_result")"
          test "$(plutil -extract status raw -o - "$notary_result")" = "Accepted"
          xcrun notarytool log "$request_id" "$notary_log" \
            --key "$APP_STORE_CONNECT_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID"
          plutil -lint "$notary_log"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

          ditto -c -k --keepParent "$app" "$archive"
          archive_name="$(basename "$archive")"
          (cd "$output" && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          echo "MAC_RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Retain verified notarized artifact for seven days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClickBridgeMac-${{ inputs.release_tag }}
          path: |
            ${{ env.MAC_RELEASE_ARCHIVE }}
            ${{ env.MAC_RELEASE_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Create draft GitHub release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" \
            "$MAC_RELEASE_ARCHIVE" \
            "$MAC_RELEASE_ARCHIVE.sha256" \
            --verify-tag \
            --draft \
            --title "Click Bridge ${RELEASE_TAG}" \
            --notes "Notarized macOS release candidate. Review the draft and checksum before any separate publication decision."

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          test -z "${SIGNING_KEYCHAIN:-}" || security delete-keychain "$SIGNING_KEYCHAIN" || true
          test -z "${APP_STORE_CONNECT_KEY_PATH:-}" || rm -f "$APP_STORE_CONNECT_KEY_PATH"
          test -z "${SIGNING_CERTIFICATE_PATH:-}" || rm -f "$SIGNING_CERTIFICATE_PATH"
