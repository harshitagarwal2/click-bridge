name: iOS and macOS TestFlight upload

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag that must point at the dispatched commit
        required: true
        type: string
      build_number:
        description: Monotonically increasing App Store Connect build number
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-store-release
  cancel-in-progress: false

jobs:
  verify-environment:
    name: Verify protected release environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require independent release approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: testflight
        run: |
          set -Eeuo pipefail
          encoded_environment="$(jq -rn --arg name "$RELEASE_ENVIRONMENT" '$name | @uri')"
          environment_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/${encoded_environment}"
          )"
          jq -e --arg expected "$RELEASE_ENVIRONMENT" '
            .name == $expected and
            .can_admins_bypass == false and
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | type == "array" and length >= 1)
            )
          ' <<< "$environment_json" >/dev/null

  upload:
    name: Build and upload iOS and macOS without tester distribution
    needs: verify-environment
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: testflight
    steps:
      - name: Revalidate protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: testflight
        run: |
          set -Eeuo pipefail
          encoded_environment="$(jq -rn --arg name "$RELEASE_ENVIRONMENT" '$name | @uri')"
          environment_json="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/${encoded_environment}"
          )"
          jq -e --arg expected "$RELEASE_ENVIRONMENT" '
            .name == $expected and
            .can_admins_bypass == false and
            any(.protection_rules[]?;
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | type == "array" and length >= 1)
            )
          ' <<< "$environment_json" >/dev/null

      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release tag and build number
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$EVENT_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$EVENT_SHA"
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Reject placeholder release notes
        run: |
          set -Eeuo pipefail
          ! grep -q 'REPLACE BEFORE RELEASE' fastlane/metadata/en-US/release_notes.txt

      - name: Select Ruby and install locked Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install XcodeGen
        run: |
          set -Eeuo pipefail
          version='2.46.0'
          expected_sha256='4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
          archive="$RUNNER_TEMP/xcodegen-${version}.zip"
          extracted="$RUNNER_TEMP/xcodegen-${version}-source"
          install_root="$RUNNER_TEMP/xcodegen-${version}"
          curl --fail --location --retry 3 \
            --output "$archive" \
            'https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip'
          printf '%s  %s\n' "$expected_sha256" "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$extracted"
          PREFIX="$install_root" "$extracted/xcodegen/install.sh"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/xcodegen" --version | grep -Fx 'Version: 2.46.0'

      - name: Configure ephemeral App Store signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          MAC_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_DISTRIBUTION_CERTIFICATE_BASE64 }}
          MAC_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -Eeuo pipefail
          umask 077
          for required in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64 \
            IOS_CERTIFICATE_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROFILE_BASE64 \
            MAC_DISTRIBUTION_CERTIFICATE_BASE64 \
            MAC_DISTRIBUTION_CERTIFICATE_PASSWORD \
            MAC_INSTALLER_CERTIFICATE_BASE64 \
            MAC_INSTALLER_CERTIFICATE_PASSWORD \
            MAC_PROFILE_BASE64; do
            test -n "${!required}"
          done

          keychain="$RUNNER_TEMP/click-bridge-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          ios_certificate="$RUNNER_TEMP/ios-apple-distribution.p12"
          ios_profile="$RUNNER_TEMP/click-bridge-ios.mobileprovision"
          ios_profile_plist="$RUNNER_TEMP/click-bridge-ios-profile.plist"
          mac_distribution_certificate="$RUNNER_TEMP/mac-apple-distribution.p12"
          mac_installer_certificate="$RUNNER_TEMP/mac-installer-distribution.p12"
          mac_profile="$RUNNER_TEMP/click-bridge-mac.provisionprofile"
          mac_profile_plist="$RUNNER_TEMP/click-bridge-mac-profile.plist"
          api_key="$RUNNER_TEMP/click-bridge-app-store-connect-key.p8"

          {
            printf 'APP_STORE_CONNECT_KEY_ID=%s\n' "$APP_STORE_CONNECT_KEY_ID"
            printf 'APP_STORE_CONNECT_ISSUER_ID=%s\n' "$APP_STORE_CONNECT_ISSUER_ID"
            printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$api_key"
            printf 'SIGNING_KEYCHAIN=%s\n' "$keychain"
            printf 'IOS_SIGNING_CERTIFICATE_PATH=%s\n' "$ios_certificate"
            printf 'IOS_SIGNING_INPUT_PROFILE_PATH=%s\n' "$ios_profile"
            printf 'IOS_SIGNING_PROFILE_PLIST_PATH=%s\n' "$ios_profile_plist"
            printf 'MAC_DISTRIBUTION_CERTIFICATE_PATH=%s\n' "$mac_distribution_certificate"
            printf 'MAC_INSTALLER_CERTIFICATE_PATH=%s\n' "$mac_installer_certificate"
            printf 'MAC_SIGNING_INPUT_PROFILE_PATH=%s\n' "$mac_profile"
            printf 'MAC_SIGNING_PROFILE_PLIST_PATH=%s\n' "$mac_profile_plist"
          } >> "$GITHUB_ENV"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$ios_certificate"
          printf '%s' "$IOS_PROFILE_BASE64" | openssl base64 -d -A -out "$ios_profile"
          printf '%s' "$MAC_DISTRIBUTION_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$mac_distribution_certificate"
          printf '%s' "$MAC_INSTALLER_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$mac_installer_certificate"
          printf '%s' "$MAC_PROFILE_BASE64" | openssl base64 -d -A -out "$mac_profile"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | openssl base64 -d -A -out "$api_key"
          chmod 0600 \
            "$ios_certificate" \
            "$ios_profile" \
            "$mac_distribution_certificate" \
            "$mac_installer_certificate" \
            "$mac_profile" \
            "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$ios_certificate" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security import "$mac_distribution_certificate" -k "$keychain" -P "$MAC_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security import "$mac_installer_certificate" -k "$keychain" -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          security cms -D -i "$ios_profile" > "$ios_profile_plist"
          ios_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$ios_profile_plist")"
          ios_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$ios_profile_plist")"

          security cms -D -i "$mac_profile" > "$mac_profile_plist"
          mac_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$mac_profile_plist")"
          mac_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$mac_profile_plist")"

          [[ "$ios_profile_uuid" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]
          [[ "$mac_profile_uuid" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]
          test -n "$ios_profile_name"
          test -n "$mac_profile_name"
          [[ "$ios_profile_name" != *$'\n'* && "$ios_profile_name" != *$'\r'* ]]
          [[ "$mac_profile_name" != *$'\n'* && "$mac_profile_name" != *$'\r'* ]]

          install -d "$HOME/Library/MobileDevice/Provisioning Profiles"
          ios_installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/${ios_profile_uuid}.mobileprovision"
          mac_installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/${mac_profile_uuid}.provisionprofile"

          {
            printf 'IOS_PROVISIONING_PROFILE_NAME=%s\n' "$ios_profile_name"
            printf 'MAC_PROVISIONING_PROFILE_NAME=%s\n' "$mac_profile_name"
            printf 'IOS_SIGNING_PROFILE_PATH=%s\n' "$ios_installed_profile"
            printf 'MAC_SIGNING_PROFILE_PATH=%s\n' "$mac_installed_profile"
          } >> "$GITHUB_ENV"

          cp "$ios_profile" "$ios_installed_profile"
          cp "$mac_profile" "$mac_installed_profile"

      - name: Generate the iOS project
        working-directory: ios
        run: xcodegen generate

      - name: Generate the macOS project
        working-directory: mac
        run: xcodegen generate

      - name: Upload iOS to TestFlight only
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios upload_testflight release_version:"$RELEASE_VERSION" build_number:"$BUILD_NUMBER"

      - name: Upload macOS to TestFlight only
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bundle exec fastlane mac upload_testflight release_version:"$RELEASE_VERSION" build_number:"$BUILD_NUMBER"

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          cleanup_status=0

          remove_file() {
            local path="$1"
            if ! rm -f -- "$path"; then
              printf '::error::Failed to remove ephemeral file %s\n' "$path" >&2
              cleanup_status=1
            fi
          }

          remove_tree() {
            local path="$1"
            if ! rm -rf -- "$path"; then
              printf '::error::Failed to remove ephemeral directory %s\n' "$path" >&2
              cleanup_status=1
            fi
          }

          keychain="$RUNNER_TEMP/click-bridge-signing.keychain-db"
          if [[ -e "$keychain" || -L "$keychain" ]] && ! security delete-keychain "$keychain"; then
            echo '::error::Failed to delete the ephemeral signing keychain' >&2
            cleanup_status=1
          fi
          remove_file "$keychain"

          test -z "${IOS_SIGNING_PROFILE_PATH:-}" || remove_file "$IOS_SIGNING_PROFILE_PATH"
          test -z "${MAC_SIGNING_PROFILE_PATH:-}" || remove_file "$MAC_SIGNING_PROFILE_PATH"

          remove_file "$RUNNER_TEMP/click-bridge-app-store-connect-key.p8"
          remove_file "$RUNNER_TEMP/ios-apple-distribution.p12"
          remove_file "$RUNNER_TEMP/click-bridge-ios.mobileprovision"
          remove_file "$RUNNER_TEMP/click-bridge-ios-profile.plist"
          remove_file "$RUNNER_TEMP/mac-apple-distribution.p12"
          remove_file "$RUNNER_TEMP/mac-installer-distribution.p12"
          remove_file "$RUNNER_TEMP/click-bridge-mac.provisionprofile"
          remove_file "$RUNNER_TEMP/click-bridge-mac-profile.plist"
          remove_file "$RUNNER_TEMP/ClickBridgePhone.ipa"
          remove_file "$RUNNER_TEMP/ClickBridgePhone.app.dSYM.zip"
          remove_file "$RUNNER_TEMP/ClickBridgeMac.pkg"
          remove_file "$RUNNER_TEMP/ClickBridgeMac.app.dSYM.zip"
          remove_tree "$RUNNER_TEMP/ClickBridgePhone.xcarchive"
          remove_tree "$RUNNER_TEMP/ClickBridgeMac.xcarchive"
          remove_tree "$RUNNER_TEMP/ClickBridgeMac.app"

          exit "$cleanup_status"
